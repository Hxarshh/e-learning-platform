<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — EduPlatform</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <script>if (typeof requireAuth === 'function') requireAuth();</script>
    <div id="navbar"></div>
    <div id="sidebar"></div>

    <main class="content-wrapper">
        <div class="page-container" style="max-width: 860px;">
            <div class="page-header">
                <div>
                    <h1 class="page-title">👤 Account Profile</h1>
                    <p class="page-subtitle">Manage personal information, avatar, and credentials</p>
                </div>
            </div>

            <!-- Profile Info Card -->
            <div class="card" style="margin-bottom: var(--space-6);">
                <div class="flex items-center gap-6" style="flex-wrap: wrap;">
                    <div style="position: relative; width: 100px; height: 100px; border-radius: var(--radius-full); overflow: hidden; background: var(--bg-surface-alt); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; border: 3px solid var(--border-color);">
                        <span id="avatarPreview">👤</span>
                        <img id="avatarImg" src="" alt="Avatar" style="display:none; width:100%; height:100%; object-fit:cover;">
                    </div>
                    <div style="flex: 1;">
                        <h2 id="profileName" style="font-size:1.4rem; font-weight:700;">Loading...</h2>
                        <p id="profileEmail" style="color:var(--text-muted); font-size:0.9rem;">user@example.com</p>
                        <div style="margin-top:6px;">
                            <span id="profileRole" class="badge">ROLE</span>
                        </div>
                    </div>
                    <div>
                        <label class="btn btn-secondary btn-sm" style="cursor:pointer;">
                            Upload Avatar 📷
                            <input type="file" id="avatarInput" accept="image/png, image/jpeg, image/webp" style="display:none;">
                        </label>
                    </div>
                </div>
            </div>

            <!-- Bio Form -->
            <div class="card" style="margin-bottom: var(--space-6);">
                <h3 class="section-title">About Me</h3>
                <div class="form-group">
                    <textarea id="bioInput" class="textarea" placeholder="Write a short summary about yourself, research interests, or academic goals..."></textarea>
                </div>
                <div class="flex justify-end">
                    <button id="saveBioBtn" class="btn btn-primary">Save Changes</button>
                </div>
            </div>

            <!-- Certificates Earned Placeholder (Filled in Section 9) -->
            <div class="card" id="certificatesSection">
                <h3 class="section-title">🏆 Certificates Earned</h3>
                <div id="certificatesContainer" class="empty-state" style="margin:0; padding:var(--space-6);">
                    <div class="empty-state-icon">🎓</div>
                    <h4 class="empty-state-title">No Certificates Yet</h4>
                    <p class="empty-state-desc">Complete 100% of a course to automatically earn verified digital certificates.</p>
                </div>
            </div>
        </div>
    </main>

    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
