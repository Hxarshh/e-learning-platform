<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Class Attendance - Teacher</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/courses.css">
</head>
<body>
    <div id="navbar"></div>
    <div id="sidebar"></div>

    <div class="container">
        <div class="page-header">
            <h1>Live Class Attendance</h1>
            <a href="teacher-dashboard.html" class="btn-action">&larr; Back</a>
        </div>

        <div id="message"></div>

        <!-- Live Class Info -->
        <div id="liveClassInfo" class="detail-card" style="margin-bottom: 30px;">
            <h2 id="liveClassTitle"></h2>
            <p><strong>Date:</strong> <span id="liveClassDate"></span></p>
            <p><strong>Status:</strong> <span id="liveClassStatus" class="badge"></span></p>
            <p><strong>Meeting Ref:</strong> <span id="meetingRef">—</span></p>
        </div>

        <!-- Attendance Table -->
        <h3>Attendance</h3>
        <div class="table-responsive">
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>Student</th>
                        <th>Join Time</th>
                        <th>Status</th>
                        <th>Leave Time</th>
                        <th>Duration</th>
                    </tr>
                </thead>
                <tbody id="attendanceTableBody">
                    <tr><td colspan="5" style="text-align:center;">Loading attendance...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Controls -->
        <div class="mt-4">
            <button onclick="markAllPresent()" class="btn-action btn-active">Mark All Present</button>
            <span class="ml-3"><small>(only for LIVE classes)</small></span>
        </div>
    </div>
    <script>
        /* Early route guard — runs before layout.js is fully parsed */
        (function() {
            var token = localStorage.getItem("jwtToken") || sessionStorage.getItem("jwtToken");
            if (!token) { window.location.href = "login.html"; return; }
            try {
                var p = JSON.parse(atob(token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
                if (p.exp && Date.now()/1000 > p.exp) {
                    localStorage.removeItem("jwtToken"); sessionStorage.removeItem("jwtToken");
                    window.location.href = "login.html?reason=expired";
                }
                var role = p.role || "";
                var allowed = ["TEACHER"];
                if (allowed.length && allowed.indexOf(role) === -1) {
                    var map = {ADMIN:"admin-dashboard.html",TEACHER:"teacher-dashboard.html",STUDENT:"student-dashboard.html"};
                    window.location.href = map[role] || "login.html";
                }
            } catch(e) { window.location.href = "login.html"; }
        })();
    </script>
    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/teacher-attendance.js"></script>
</body>
</html>
