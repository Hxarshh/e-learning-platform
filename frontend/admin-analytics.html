<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Analytics — EduPlatform</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <script>if (typeof requireAuth === 'function') requireAuth(['ADMIN']);</script>
    <div id="navbar"></div>
    <div id="sidebar"></div>

    <main class="content-wrapper">
        <div class="page-container">
            <div class="page-header">
                <div>
                    <h1 class="page-title">📈 System Analytics & Insights</h1>
                    <p class="page-subtitle">Platform adoption, enrollment velocity, revenue trends, and user statistics</p>
                </div>
            </div>

            <!-- KPI Metric Cards -->
            <div class="grid grid-4" style="margin-bottom: var(--space-8);">
                <div class="card">
                    <p style="font-size:0.85rem; color:var(--text-muted); font-weight:600;">TOTAL USERS</p>
                    <h2 id="kpiUsers" style="font-size:2rem; font-weight:800; margin-top:4px; color:var(--primary);">...</h2>
                </div>
                <div class="card">
                    <p style="font-size:0.85rem; color:var(--text-muted); font-weight:600;">ACTIVE COURSES</p>
                    <h2 id="kpiCourses" style="font-size:2rem; font-weight:800; margin-top:4px; color:var(--info);">...</h2>
                </div>
                <div class="card">
                    <p style="font-size:0.85rem; color:var(--text-muted); font-weight:600;">ENROLLMENTS</p>
                    <h2 id="kpiEnrollments" style="font-size:2rem; font-weight:800; margin-top:4px; color:var(--success);">...</h2>
                </div>
                <div class="card">
                    <p style="font-size:0.85rem; color:var(--text-muted); font-weight:600;">TOTAL REVENUE</p>
                    <h2 id="kpiRevenue" style="font-size:2rem; font-weight:800; margin-top:4px; color:var(--warning);">...</h2>
                </div>
            </div>

            <!-- Charts Grid -->
            <div class="grid grid-2">
                <div class="card">
                    <h3 class="section-title">📊 Enrollments Velocity (Over Time)</h3>
                    <div style="height: 280px; position:relative;">
                        <canvas id="enrollmentsChart"></canvas>
                    </div>
                </div>

                <div class="card">
                    <h3 class="section-title">👥 User Role Distribution</h3>
                    <div style="height: 280px; position:relative;">
                        <canvas id="rolesChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async function() {
            try {
                const overview = await api.get("/api/admin/analytics/overview");
                document.getElementById("kpiUsers").textContent = overview.totalUsers || 0;
                document.getElementById("kpiCourses").textContent = overview.totalCourses || 0;
                document.getElementById("kpiEnrollments").textContent = overview.totalEnrollments || 0;
                document.getElementById("kpiRevenue").textContent = "₹" + (overview.totalRevenue || 0);

                // Roles Doughnut Chart
                const rolesCtx = document.getElementById('rolesChart').getContext('2d');
                new Chart(rolesCtx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Students', 'Teachers', 'Admins'],
                        datasets: [{
                            data: [overview.studentsCount || 1, overview.teachersCount || 1, overview.adminsCount || 1],
                            backgroundColor: ['#10b981', '#4f46e5', '#ef4444']
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });

                // Enrollments Trend Chart
                const trend = await api.get("/api/admin/analytics/enrollments-trend");
                const labels = Object.keys(trend).length ? Object.keys(trend) : ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
                const values = Object.values(trend).length ? Object.values(trend) : [12, 19, 3, 5, 2, 8, 15];

                const enrollCtx = document.getElementById('enrollmentsChart').getContext('2d');
                new Chart(enrollCtx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'New Enrollments',
                            data: values,
                            borderColor: '#4f46e5',
                            backgroundColor: 'rgba(79, 70, 229, 0.1)',
                            fill: true,
                            tension: 0.3
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });

            } catch(e) {
                showToast("Failed to load analytics: " + e.message, "error");
            }
        });
    </script>
</body>
</html>
