<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Builder — EduPlatform</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <script>if (typeof requireAuth === 'function') requireAuth(['TEACHER']);</script>
    <div id="navbar"></div>
    <div id="sidebar"></div>

    <main class="content-wrapper">
        <div class="page-container" style="max-width: 900px;">
            <div class="page-header">
                <div>
                    <h1 class="page-title">📝 Quiz Builder</h1>
                    <p class="page-subtitle">Design questions, multiple choice options, and set passing criteria</p>
                </div>
                <button id="saveQuizBtn" class="btn btn-primary">Save & Publish Quiz</button>
            </div>

            <div class="card" style="margin-bottom: var(--space-6);">
                <div class="form-group">
                    <label class="form-label">Quiz Title</label>
                    <input type="text" id="quizTitle" class="input" placeholder="e.g. Chapter 1 Mid-Term Assessment" required>
                </div>
                <div class="grid grid-2">
                    <div class="form-group">
                        <label class="form-label">Time Limit (Minutes)</label>
                        <input type="number" id="quizTimeLimit" class="input" placeholder="e.g. 15 (0 for unlimited)" value="15">
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-between" style="margin-bottom: var(--space-4);">
                <h3 class="section-title" style="margin:0;">Questions</h3>
                <button id="addQuestionBtn" class="btn btn-secondary btn-sm">+ Add Question</button>
            </div>

            <div id="questionsContainer" class="flex flex-col gap-4">
                <!-- Question cards dynamically added here -->
            </div>
        </div>
    </main>

    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/teacher-quiz-builder.js"></script>
</body>
</html>
