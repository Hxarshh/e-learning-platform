<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Course - Student</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div id="navbar"></div>
    <div id="sidebar"></div>

    <div class="container">
        <div class="page-header">
            <h1>Join a Course</h1>
            <a href="student-dashboard.html" class="btn-action">&larr; Back to Dashboard</a>
        </div>

        <div id="message"></div>

        <div class="form-box" style="max-width: 500px; margin: 0 auto;">
            <h2>Enter Enrollment Code</h2>
            <p>Ask your teacher for the enrollment code to join their course.</p>

            <form id="joinForm">
                <input type="text" id="enrollmentCode" placeholder="e.g. J8K4P2" required style="text-transform: uppercase;">
                <button type="submit">Join Course</button>
            </form>
        </div>
    </div>
    <script>
        /* Early route guard — runs before layout.js is fully parsed */
        (function() {
            var token = localStorage.getItem("jwtToken") || sessionStorage.getItem("jwtToken");
            if (!token) { window.location.href = "login.html"; return; }
            try {
                var p = JSON.parse(atob(token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
                if (p.exp && Date.now()/1000 > p.exp) {
                    localStorage.removeItem("jwtToken"); sessionStorage.removeItem("jwtToken");
                    window.location.href = "login.html?reason=expired";
                }
                var role = p.role || "";
                var allowed = ["STUDENT"];
                if (allowed.length && allowed.indexOf(role) === -1) {
                    var map = {ADMIN:"admin-dashboard.html",TEACHER:"teacher-dashboard.html",STUDENT:"student-dashboard.html"};
                    window.location.href = map[role] || "login.html";
                }
            } catch(e) { window.location.href = "login.html"; }
        })();
    </script>
    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/student-join-course.js"></script>
</body>
</html>
