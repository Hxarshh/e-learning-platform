<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module Resources - Teacher</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/courses.css">
</head>
<body>
    <div id="navbar"></div>
    <div id="sidebar"></div>

    <div class="container">
        <div class="page-header">
            <h1>Module Resources</h1>
            <a href="teacher-course-detail.html" class="btn-action">&larr; Back</a>
        </div>

        <div id="message"></div>

        <!-- Upload Form -->
        <div class="form-box" style="max-width: 600px; margin-bottom: 30px;">
            <h3>Upload New Resource</h3>
            <p>Allowed: PDF, PPT, PPTX, DOC, DOCX (max 20MB)</p>
            <form id="uploadForm">
                <div class="form-group">
                    <label for="resourceTitle">Resource Title</label>
                    <input type="text" id="resourceTitle" placeholder="Enter resource title" required>
                </div>
                <div class="form-group">
                    <label for="resourceFile">Resource File</label>
                    <input type="file" id="resourceFile" accept=".pdf,.ppt,.pptx,.doc,.docx" required>
                </div>
                <button type="submit">Upload Resource</button>
            </form>
        </div>

        <!-- Resource List -->
        <h3>Uploaded Resources</h3>
        <div id="resourcesList" class="course-grid">
            <p>Loading...</p>
        </div>
    </div>
    <script>
        /* Early route guard — runs before layout.js is fully parsed */
        (function() {
            var token = localStorage.getItem("jwtToken") || sessionStorage.getItem("jwtToken");
            if (!token) { window.location.href = "login.html"; return; }
            try {
                var p = JSON.parse(atob(token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
                if (p.exp && Date.now()/1000 > p.exp) {
                    localStorage.removeItem("jwtToken"); sessionStorage.removeItem("jwtToken");
                    window.location.href = "login.html?reason=expired";
                }
                var role = p.role || "";
                var allowed = ["TEACHER"];
                if (allowed.length && allowed.indexOf(role) === -1) {
                    var map = {ADMIN:"admin-dashboard.html",TEACHER:"teacher-dashboard.html",STUDENT:"student-dashboard.html"};
                    window.location.href = map[role] || "login.html";
                }
            } catch(e) { window.location.href = "login.html"; }
        })();
    </script>
    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="components/resource-card.js"></script>
    <script src="js/teacher-module-resources.js"></script>
</body>
</html>
