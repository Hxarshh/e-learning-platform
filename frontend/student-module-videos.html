<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module Videos - Student</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/courses.css">
</head>
<body>
    <div id="navbar"></div>
    <div id="sidebar"></div>

    <div class="container">
        <div class="page-header">
            <h1>Module Videos</h1>
            <a href="student-dashboard.html" class="btn-action">&larr; Back to Dashboard</a>
        </div>

        <div id="message"></div>

        <!-- Video Player (shown when a video is selected) -->
        <div id="videoPlayerContainer" style="display:none; margin-bottom: 30px;">
            <h3 id="playerTitle"></h3>
            <video id="videoPlayer" controls style="width: 100%; max-width: 800px; border-radius: 8px;">
                Your browser does not support the video tag.
            </video>
        </div>

        <!-- Video List -->
        <h3>Available Videos</h3>
        <div id="videosList" class="course-grid">
            <p>Loading...</p>
        </div>
    </div>
    <script>
        /* Early route guard — runs before layout.js is fully parsed */
        (function() {
            var token = localStorage.getItem("jwtToken") || sessionStorage.getItem("jwtToken");
            if (!token) { window.location.href = "login.html"; return; }
            try {
                var p = JSON.parse(atob(token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
                if (p.exp && Date.now()/1000 > p.exp) {
                    localStorage.removeItem("jwtToken"); sessionStorage.removeItem("jwtToken");
                    window.location.href = "login.html?reason=expired";
                }
                var role = p.role || "";
                var allowed = ["STUDENT"];
                if (allowed.length && allowed.indexOf(role) === -1) {
                    var map = {ADMIN:"admin-dashboard.html",TEACHER:"teacher-dashboard.html",STUDENT:"student-dashboard.html"};
                    window.location.href = map[role] || "login.html";
                }
            } catch(e) { window.location.href = "login.html"; }
        })();
    </script>
    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="components/video-card.js"></script>
    <script src="js/student-module-videos.js"></script>
</body>
</html>
