<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Timetable</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div id="navbar"></div>
    <div id="sidebar"></div>

    <div class="container">
        <div class="page-header">
            <h1>Manage Timetable</h1>
        </div>

        <div id="message"></div>

        <!-- Create Form -->
        <div class="form-box" style="max-width: 600px; margin-bottom: 30px;">
            <h3>Add Timetable Entry</h3>
            <form id="createForm">
                <div class="form-group">
                    <label for="courseId">Course</label>
                    <select id="courseId" required></select>
                </div>
                <div class="form-group">
                    <label for="teacherId">Teacher</label>
                    <select id="teacherId" required></select>
                </div>
                <div class="form-group">
                    <label for="sessionId">Academic Session</label>
                    <select id="sessionId" required></select>
                </div>
                <div class="form-group">
                    <label for="dayOfWeek">Day</label>
                    <select id="dayOfWeek" required>
                        <option value="Monday">Monday</option>
                        <option value="Tuesday">Tuesday</option>
                        <option value="Wednesday">Wednesday</option>
                        <option value="Thursday">Thursday</option>
                        <option value="Friday">Friday</option>
                        <option value="Saturday">Saturday</option>
                        <option value="Sunday">Sunday</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="startTime">Start Time</label>
                    <input type="time" id="startTime" required>
                </div>
                <div class="form-group">
                    <label for="endTime">End Time</label>
                    <input type="time" id="endTime" required>
                </div>
                <button type="submit">Add Entry</button>
            </form>
        </div>

        <!-- Timetable Grid -->
        <h3>Weekly Timetable</h3>
        <div id="timetableContainer">
            <p>Loading...</p>
        </div>
    </div>
    <script>
        /* Early route guard — runs before layout.js is fully parsed */
        (function() {
            var token = localStorage.getItem("jwtToken") || sessionStorage.getItem("jwtToken");
            if (!token) { window.location.href = "login.html"; return; }
            try {
                var p = JSON.parse(atob(token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
                if (p.exp && Date.now()/1000 > p.exp) {
                    localStorage.removeItem("jwtToken"); sessionStorage.removeItem("jwtToken");
                    window.location.href = "login.html?reason=expired";
                }
                var role = p.role || "";
                var allowed = ["ADMIN"];
                if (allowed.length && allowed.indexOf(role) === -1) {
                    var map = {ADMIN:"admin-dashboard.html",TEACHER:"teacher-dashboard.html",STUDENT:"student-dashboard.html"};
                    window.location.href = map[role] || "login.html";
                }
            } catch(e) { window.location.href = "login.html"; }
        })();
    </script>
    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="components/timetable.js"></script>
    <script src="js/admin-timetable.js"></script>
</body>
</html>
