<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div id="navbar"></div>
    <div id="sidebar"></div>

    <div class="container">
        <div class="page-header">
            <h1>Admin Dashboard</h1>
        </div>
        
        <div class="row">
            <div class="col-md-12">
                <div class="card mb-3">
                    <div class="card-header">
                        <h5>Welcome, Admin</h5>
                    </div>
                    <div class="card-body">
                        <p>Administrative interface for managing the e-learning platform.</p>
                        <ul>
                            <li>User management</li>
                            <li>Timetable management</li>
                            <li>Reports and analytics</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        /* Early route guard — runs before layout.js is fully parsed */
        (function() {
            var token = localStorage.getItem("jwtToken") || sessionStorage.getItem("jwtToken");
            if (!token) { window.location.href = "login.html"; return; }
            try {
                var p = JSON.parse(atob(token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
                if (p.exp && Date.now()/1000 > p.exp) {
                    localStorage.removeItem("jwtToken"); sessionStorage.removeItem("jwtToken");
                    window.location.href = "login.html?reason=expired";
                }
                var role = p.role || "";
                var allowed = ["ADMIN"];
                if (allowed.length && allowed.indexOf(role) === -1) {
                    var map = {ADMIN:"admin-dashboard.html",TEACHER:"teacher-dashboard.html",STUDENT:"student-dashboard.html"};
                    window.location.href = map[role] || "login.html";
                }
            } catch(e) { window.location.href = "login.html"; }
        })();
    </script>

    <script src="js/script.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
</body>
</html>
